[package]
name = "backcountry-rust-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Bounded Rust Lambda runtime slice for the Backcountry SMS assistant"
license = "MIT"

[lib]
name = "backcountry_runtime"
path = "src/lib.rs"

[[bin]]
name = "bootstrap"
path = "src/bin/bootstrap.rs"

[dependencies]
aws-config = "1.12"
aws-sdk-bedrockagentruntime = "1.139"
aws-sdk-bedrockruntime = "1.143"
aws-sdk-dynamodb = "1.124"
aws-sdk-geoplaces = "1.64"
aws-sdk-pinpointsmsvoicev2 = "1.121"
aws-smithy-types = "1.6"
xray-lite = "0.0.9"
lambda_runtime = "0.13"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
