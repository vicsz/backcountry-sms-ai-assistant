name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Static type checks
        run: mypy
      - name: Verify type-check failure behavior
        run: ./scripts/check-mypy-negative.sh
      - name: Unit tests
        run: pytest
      - name: Offline evaluation gates
        run: pytest -m 'eval_model or eval_location' --eval-mode=offline --eval-report-dir=local/evaluations/ci
      - name: CDK synth
        run: npx --yes aws-cdk@2 synth --quiet
