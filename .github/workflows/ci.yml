name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            changed_files="tag_push"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            changed_files="$(git diff --name-only "$empty_tree" "$HEAD_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          fi

          docs_only=true
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ "$path" == docs/* || "$path" == specs/* || "$path" == bugs/* || "$path" == enhancements/* || "$path" == .codex/* ]]; then
              continue
            fi
            if [[ "$path" == *.md && "$path" != */* ]]; then
              continue
            fi
            docs_only=false
            break
          done <<< "$changed_files"

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"
      - name: Documentation-only change
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Skipping runtime validation for documentation-only changes."
      - uses: actions/setup-python@v6
        if: steps.changes.outputs.docs_only != 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version: "22"
      - name: Install Python dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: ruff check .
      - name: Static type checks
        if: steps.changes.outputs.docs_only != 'true'
        run: mypy
      - name: Verify type-check failure behavior
        if: steps.changes.outputs.docs_only != 'true'
        run: ./scripts/check-mypy-negative.sh
      - name: Unit tests
        if: steps.changes.outputs.docs_only != 'true'
        run: pytest
      - name: Offline evaluation gates
        if: steps.changes.outputs.docs_only != 'true'
        run: pytest -m 'eval_model or eval_location' --eval-mode=offline --eval-report-dir=local/evaluations/ci
      - name: CDK synth
        if: steps.changes.outputs.docs_only != 'true'
        run: npx --yes aws-cdk@2 synth --quiet
